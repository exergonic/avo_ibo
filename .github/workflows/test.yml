# Minimal CI: full pytest suite on every push/PR.
# Windows matches pixi.lock (win-64); psi4 comes from conda-forge via pixi.
name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.66.0
          locked: true
      - run: pixi run test
